<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Analytics Study Site</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background: white; border-radius: 10px; padding: 40px; max-width: 600px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        h1 { color: #333; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 30px; }
        .btn { background: #667eea; color: white; border: none; padding: 12px 24px; border-radius: 5px; cursor: pointer; font-size: 16px; margin: 5px; transition: background 0.3s; }
        .btn:hover { background: #5568d3; }
        .section { margin: 20px 0; padding: 20px; background: #f8f9fa; border-radius: 5px; }
        .section h2 { font-size: 18px; color: #333; margin-bottom: 15px; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; margin-bottom: 10px; }
        #counter { font-size: 24px; color: #667eea; font-weight: bold; }
    </style>

<body>
    <div class="container">
        <h1>Google Analytics Study Site</h1>
        <p>Use this page to test and learn Google Analytics tracking</p>

        <div class="section">
            <h2>Page Interactions</h2>
            <button class="btn" onclick="trackClick('Button 1')">Click Me - Button 1</button>
            <button class="btn" onclick="trackClick('Button 2')">Click Me - Button 2</button>
            <p style="margin-top: 10px;">Clicks: <span id="counter">0</span></p>
        </div>

        <div class="section">
            <h2>Form Interaction</h2>
            <input type="text" id="searchBox" placeholder="Type something here...">
            <button class="btn" onclick="trackSearch()">Search</button>
        </div>

        <div class="section">
            <h2>External Links</h2>
            <a href="https://analytics.google.com" target="_blank" onclick="trackOutbound('Google Analytics')">
                <button class="btn">Visit Google Analytics</button>
            </a>
            <a href="https://developers.google.com/analytics" target="_blank" onclick="trackOutbound('GA Docs')">
                <button class="btn">Visit GA Documentation</button>
            </a>
        </div>

        <div class="section">
            <h2>Download Tracking</h2>
            <button class="btn" onclick="trackDownload('sample-file.pdf')">Download Sample PDF</button>
        </div>
    </div>

    <script>
        let clickCount = 0;

        function trackClick(buttonName) {
            clickCount++;
            document.getElementById('counter').textContent = clickCount;
            console.log('Button clicked:', buttonName);
            // GA4 event tracking (add when you set up GA)
            // gtag('event', 'button_click', { 'button_name': buttonName });
        }

        function trackSearch() {
            const searchTerm = document.getElementById('searchBox').value;
            console.log('Search performed:', searchTerm);
            alert('Search tracked: ' + searchTerm);
            // GA4 event tracking
            // gtag('event', 'search', { 'search_term': searchTerm });
        }

        function trackOutbound(linkName) {
            console.log('Outbound link clicked:', linkName);
            // GA4 event tracking
            // gtag('event', 'click', { 'event_category': 'outbound', 'event_label': linkName });
        }

        function trackDownload(fileName) {
            console.log('Download tracked:', fileName);
            alert('Download tracked: ' + fileName);
            // GA4 event tracking
            // gtag('event', 'file_download', { 'file_name': fileName });
        }
    </script>
