<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Tracking Final Test</title>

<style>
body { font-family: Arial; background:#f5f5f5; padding:30px; }
.container { background:white; padding:20px; max-width:600px; margin:auto; }
input, select { width:100%; padding:10px; margin-bottom:10px; }
button { padding:10px; width:100%; background:#667eea; color:white; border:none; }
#eventLog { font-size:12px; max-height:150px; overflow:auto; margin-top:10px; }
</style>

<!-- GTM -->
<script>
(function(w,d,s,l,i){w[l]=w[l]||[];
w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});
var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';
j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;
f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','GTM-P4M55FSK');
</script>

</head>

<body>

<noscript>
<iframe src="https://www.googletagmanager.com/ns.html?id=GTM-P4M55FSK"
height="0" width="0" style="display:none"></iframe>
</noscript>

<div class="container">
<h2>Form Tracking Test</h2>

<form id="registrationForm">

<input type="text" name="full_name" placeholder="Full Name" required>
<input type="email" name="email" placeholder="Email" required>
<input type="tel" name="phone" placeholder="Phone" required>

<select name="occupation">
<option value="">Select Occupation</option>
<option>Student</option>
<option>Developer</option>
</select>

<button type="submit">Submit</button>
</form>

<!-- Debug Panel -->
<div style="border:1px solid #ccc; padding:10px; margin-top:20px;">
<h3>🔍 Debug Panel</h3>
<div id="eventLog"></div>
</div>
</div>

<script>
(function(){

  window.dataLayer = window.dataLayer || [];
  let formStarted = new Set();

  function logEvent(name, data){
    console.log("🔥", name, data);

    const box = document.getElementById("eventLog");
    if(box){
      const p = document.createElement("p");
      p.innerText = name + " → " + JSON.stringify(data);
      box.appendChild(p);
    }
  }

  function getFieldType(el){
    return el.type || el.tagName.toLowerCase();
  }

  function trackFormStart(form){
    const formId = form.id || "unknown";

    if(!formStarted.has(formId)){
      formStarted.add(formId);

      const data = {
        event: "form_start",
        form_id: formId,
        form_name: form.name || formId
      };

      dataLayer.push(data);
      logEvent("form_start", data);
    }
  }

  // Focus
  document.addEventListener("focus", function(e){
    const form = e.target.closest("form");
    if(!form) return;

    trackFormStart(form);

    const data = {
      event: "form_field_focus",
      form_id: form.id || "unknown",
      form_name: form.name || form.id,
      form_field_name: e.target.name || e.target.id,
      form_field_type: getFieldType(e.target)
    };

    dataLayer.push(data);
    logEvent("form_field_focus", data);

  }, true);

  // Blur
  document.addEventListener("blur", function(e){
    const form = e.target.closest("form");
    if(!form) return;

    const data = {
      event: "form_field_blur",
      form_id: form.id || "unknown",
      form_name: form.name || form.id,
      form_field_name: e.target.name || e.target.id,
      form_field_type: getFieldType(e.target)
    };

    dataLayer.push(data);
    logEvent("form_field_blur", data);

  }, true);

  // Submit
  document.addEventListener("submit", function(e){
    e.preventDefault();

    const form = e.target;

    const fields = form.querySelectorAll("input, select, textarea");

    let filled = 0;

    fields.forEach(f => {
      if(f.value && f.value.trim() !== "") filled++;
    });

    const data = {
      event: "form_submit",
      form_id: form.id || "unknown",
      form_name: form.name || form.id,
      total_fields: fields.length,
      filled_fields: filled
    };

    dataLayer.push(data);
    logEvent("form_submit", data);

    alert("Form Submitted");
  });

})();
</script>

</body>
</html>
